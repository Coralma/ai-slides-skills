<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sinochem Signature — Style Preview</title>

<!-- 企业级中英文字体组合：思源黑体 + Manrope -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
  /* ============ THEME TOKENS ============ */
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f7f9f8;
    --brand-green: #00A758;
    --brand-green-dark: #007a3e;
    --brand-green-soft: #e6f5ed;
    --accent-navy: #1e3a5f;
    --text-primary: #0f1a13;
    --text-secondary: #5a6b60;
    --divider: #e5ebe7;

    --font-display: "Noto Sans SC", "Manrope", sans-serif;
    --font-body: "Noto Sans SC", "Manrope", sans-serif;
    --font-num: "Manrope", sans-serif;

    /* 所有字号用 cqw/cqh 相对 16:9 画布而非浏览器 viewport，
       保证 PPTX 导出（1920×1080）与任何比例浏览器预览完全一致 */
    --title-size:    clamp(1.4rem, 2.4cqw, 2rem);
    --subtitle-size: clamp(1rem, 1.8cqw, 1.35rem);
    --body-size:     clamp(0.85rem, 1.2cqw, 1.05rem);
    --meta-size:     clamp(0.7rem, 1cqw, 0.875rem);
    --slide-padding: clamp(2rem, 5cqw, 5rem);

    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ============ 16:9 CANVAS LOCK（letterbox） ============
     不再让 .slide 完全自适应浏览器；改由 .deck 容器锁定 16:9，
     多余区域由 html/body 背景（letterbox 条）填充。PPTX 导出时
     Chromium viewport = 1920×1080，.deck 刚好铺满，无缝一致。 */
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #0f1a13;
    font-family: var(--font-body);
    color: var(--text-primary);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .deck {
    /* 永远按 16:9 等比最大化，不被浏览器宽高比扭曲 */
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    background: var(--bg-primary);
    box-shadow: 0 12px 60px rgba(0, 0, 0, 0.25);
    /* 启用容器查询：内部 cqw/cqh 相对 deck（也即 slide）而非浏览器 */
    container-type: size;
    container-name: deck;
  }

  /* ============ SLIDE ============ */
  .slide {
    width: 100%;
    height: 100%;           /* 等于 .deck，即锁定 16:9 */
    aspect-ratio: 16 / 9;
    overflow: hidden;
    display: grid;
    /* 标题区 / 正文区 / 页脚 —— 标题永远置顶 */
    grid-template-rows: auto 1fr auto;
    row-gap: clamp(1rem, 2cqw, 2rem);
    padding: var(--slide-padding);
    padding-bottom: calc(var(--slide-padding) + clamp(40px, 6cqh, 68px));
    position: relative;
    background: var(--bg-primary);
    scroll-snap-align: start;
  }

  /* ============ HEADER（标题永远在最上方） ============
     把 eyebrow / 主标题 / 品牌绿短横线 / 副标题 全部放进 grid row 1，
     采用 column flex，不做任何垂直居中 —— 保证无论内容多少都贴顶。 */
  .slide-header {
    display: flex;
    flex-direction: column;
    gap: clamp(0.5rem, 1cqw, 1rem);
    align-items: flex-start;
  }

  .meta-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    width: 100%;
    font-family: var(--font-num);
    font-size: var(--meta-size);
    color: var(--text-secondary);
    letter-spacing: 0.08em;
    margin-bottom: clamp(0.5rem, 1cqw, 1rem);
  }
  .meta-row .dot { color: var(--brand-green); font-weight: 800; margin: 0 0.5rem; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--font-num);
    font-size: var(--meta-size);
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brand-green-dark);
    padding: 0.4rem 0.9rem;
    background: var(--brand-green-soft);
    border-radius: 999px;
  }
  .eyebrow::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--brand-green);
  }

  h1.title {
    font-family: var(--font-display);
    font-size: var(--title-size);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }
  h1.title .accent { color: var(--brand-green); }

  /* 签名元素：标题下方的品牌绿短横线 */
  .accent-rule {
    width: clamp(40px, 4cqw, 64px);
    height: 3px;
    background: var(--brand-green);
  }

  .subtitle {
    font-size: var(--subtitle-size);
    color: var(--text-secondary);
    line-height: 1.55;
    max-width: 640px;
    font-weight: 400;
  }

  /* ============ MAIN CONTENT ============ */
  .slide-body {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;   /* 从顶部排起，不再居中 */
    gap: clamp(1rem, 2cqw, 1.75rem);
    overflow: hidden;
  }

  /* ============ STATS ROW ============ */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(1rem, 3cqw, 2.5rem);
    padding-top: clamp(1rem, 2cqw, 1.5rem);
    border-top: 1px solid var(--divider);
  }

  .stat .num {
    font-family: var(--font-num);
    font-weight: 800;
    font-size: clamp(1.75rem, 3.5cqw, 2.75rem);
    color: var(--brand-green);
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .stat .num .unit {
    font-size: 0.55em;
    color: var(--accent-navy);
    margin-left: 0.25rem;
    font-weight: 700;
  }
  .stat .label {
    margin-top: 0.5rem;
    font-size: var(--meta-size);
    color: var(--text-secondary);
    letter-spacing: 0.05em;
  }

  /* ============ FOOTER ============ */
  .slide-footer {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    font-family: var(--font-num);
    font-size: var(--meta-size);
    color: var(--text-secondary);
    border-top: 1px solid var(--divider);
    padding-top: clamp(0.75rem, 1.5cqw, 1.25rem);
  }
  .page-index { font-weight: 700; letter-spacing: 0.1em; }
  .page-index .sep { color: var(--brand-green); margin: 0 0.25rem; }

  /* ============ LOGO WATERMARK（底部左侧） ============ */
  .logo-bottom {
    position: absolute;
    left: var(--slide-padding);
    bottom: var(--slide-padding);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    z-index: 10;
  }
  .logo-bottom img {
    max-height: clamp(24px, 3.5cqh, 38px);
    width: auto;
  }
  .logo-bottom .company-name {
    color: var(--brand-green);
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 700;
    font-size: clamp(12px, 1.8cqh, 19px);
    white-space: nowrap;
  }

  /* ============ ANIMATIONS ============ */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .slide-header > *, .slide-body > * {
    animation: fadeUp 0.4s var(--ease-out) both;
  }
  .slide-header > *:nth-child(1) { animation-delay: 0.05s; }
  .slide-header > *:nth-child(2) { animation-delay: 0.15s; }
  .slide-header > *:nth-child(3) { animation-delay: 0.25s; }
  .slide-header > *:nth-child(4) { animation-delay: 0.35s; }
  .slide-body   > *:nth-child(1) { animation-delay: 0.45s; }
</style>
</head>
<body>
  <div class="deck">
    <section class="slide">
